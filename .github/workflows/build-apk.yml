
name: AI CLIP MASTER APK Builder

on:
  workflow_dispatch:
  push:
    paths:
      - 'AI_CLIP_MASTER_Starter_Project.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract project ZIP
        run: unzip AI_CLIP_MASTER_Starter_Project.zip -d project

      - name: Build APK
        run: cd project && gradle assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-CLIP-MASTER-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          
