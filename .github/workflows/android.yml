
name: AI CLIP MASTER APK Builder

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android Project
        run: |
          mkdir -p source
          unzip -q AI_CLIP_MASTER_Starter_Project.zip -d source

      - name: Build APK
        run: |
          GRADLE_FILE=$(find source -name gradlew -type f | head -n 1)
          if [ -z "$GRADLE_FILE" ]; then
            echo "Gradle wrapper not found!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLE_FILE")
          chmod +x "$GRADLE_FILE"
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-CLIP-MASTER-APK
          path: source/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
